controller:
  replicas: 1

  serviceType: NodePort
  servicePort: 8080
  targetPort: 8080
  nodePort: 30080

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi" 
    limits:
      cpu: "1"
      memory: "1Gi"

  admin:
    createSecret: true
    username: admin
    password: admin123

  healthProbes: true

  agentListenerServiceType: ClusterIP

  installPlugins: [] #Very important, otherwise, Error

persistence:
    enabled: true
    storageClass: jenkins-pv
    size: 5Gi

serviceAccount: #Added
  create: false
  # Service account name is autogenerated by default
  name: jenkins
  annotations: {}

agents:
  kubernetes:
    enabled: true
    namespace: jenkins
    url: "https://kubernetes.default"

