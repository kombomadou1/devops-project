---
# Tasks for deploying Prometheus and Grafana

- name: Add Prometheus Community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "{{ prometheus_repo_url }}"

- name: Update Prometheus Helm repository only
  become: false
  ansible.builtin.command:
    cmd: helm repo update prometheus-community
  changed_when: false

- name: Install Prometheus Operator CRDs
  kubernetes.core.helm:
    name: prometheus-operator-crds
    chart_ref: prometheus-community/prometheus-operator-crds
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: 10m
    state: present

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    release_values: >-
          {{
            lookup(
              'ansible.builtin.file',
              role_path + '/files/prometheus-grafana-values.yaml'
            )
            | from_yaml
          }}
    wait: true
    wait_timeout: 10m
    state: present

- name: Wait for Prometheus StatefulSet to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: prometheus-prometheus-kube-prometheus-prometheus
    namespace: "{{ monitoring_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: prometheus_statefulset
  until:
    - prometheus_statefulset.resources | length > 0
    - >
      prometheus_statefulset.resources[0].status.readyReplicas
      | default(0) | int
      ==
      prometheus_statefulset.resources[0].spec.replicas | default(1) | int
  retries: 30
  delay: 10