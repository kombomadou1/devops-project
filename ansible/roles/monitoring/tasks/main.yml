---
# Tasks for deploying Prometheus and Grafana

- name: Add Prometheus Community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "{{ prometheus_repo_url }}"

- name: Install Prometheus Operator CRDs
  kubernetes.core.helm:
    name: prometheus-operator-crds
    chart_ref: prometheus-community/prometheus-operator-crds
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    state: present

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    values_files:
      - "{{ role_path }}/files/prometheus-grafana-values.yaml"
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    state: present

- name: Get Prometheus release
  kubernetes.core.helm_info:
    name: prometheus
    release_namespace: "{{ monitoring_namespace }}"
  register: prometheus_release

- name: Validate Prometheus release
  ansible.builtin.assert:
    that:
      - prometheus_release.status.status == "deployed"
    fail_msg: "Prometheus stack deployment failed."
    success_msg: "Prometheus and Grafana are deployed successfully."