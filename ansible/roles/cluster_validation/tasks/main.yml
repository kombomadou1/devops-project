---
# tasks file for roles/cluster_validation

- name: Ensure master node is ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    name: "{{ k3s_master_node_name }}"
    kubeconfig: "{{ kubeconfig }}"
  register: master_node
  until:
    - master_node.resources | length > 0
    - >
      master_node.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status')
      | first == 'True'
  retries: 30
  delay: 10

- name: Ensure worker node is ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    name: "{{ k3s_worker_node_name }}"
    kubeconfig: "{{ kubeconfig }}"
  register: worker_node
  until:
    - worker_node.resources | length > 0
    - >
      worker_node.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status')
      | first == 'True'
  retries: 30
  delay: 10