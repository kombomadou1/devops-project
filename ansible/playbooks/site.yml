---
# Main playbook for the K3s DevOps platform

- name: Apply common configuration
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: common


- name: Install K3s prerequisites
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k3s_prerequisites
      tags: k3s_prerequisites


- name: Install and configure the K3s server
  hosts: k3s_master
  become: true
  gather_facts: true
  roles:
    - role: k3s_server
      tags: k3s_server


- name: Install and configure K3s agents
  hosts: k3s_workers
  become: true
  gather_facts: true
  roles:
    - role: k3s_agent
      tags: k3s_agent


- name: Install Helm
  hosts: k3s_master
  become: true
  gather_facts: true
  roles:
    - role: helm
      tags: helm


- name: Deploy Jenkins
  hosts: k3s_master
  become: true
  gather_facts: true
  roles:
    - role: jenkins
      tags: jenkins


- name: Deploy Prometheus and Grafana
  hosts: k3s_master
  become: false
  gather_facts: true
  roles:
    - role: monitoring
      tags: monitoring


- name: Validate the Kubernetes cluster
  hosts: k3s_master
  become: true
  gather_facts: false
  roles:
    - role: cluster_validation
      tags: cluster_validation
