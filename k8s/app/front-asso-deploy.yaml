apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: front-ges-asso
  name: front-ges-asso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-ges-asso
      project: devops
  template:
    metadata:
      labels:
        app: front-ges-asso
        project: devops
    spec:
      containers:
      - image: kombomadou/front-ges-asso:prod
        name: front-ges-asso
        ports:
          - containerPort: 80
        env:
          - name: API_URL
            value: "http://back-asso-service:3000"
