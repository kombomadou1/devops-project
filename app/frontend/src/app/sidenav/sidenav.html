<mat-drawer-container class="example-container"  >
    <mat-drawer #drawer class="example-sidenav" mode="side" opened>
        <mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
                <button matIconButton disabled></button>
                @if (node.route) {
                    <button mat-button (click)="goTo(node.route)">{{node.name}}</button>    
                }
                @if (!node.route) {
                    <span>{{node.name}}</span>
                }
                
                
            </mat-tree-node>

            <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodeToggle
                            [cdkTreeNodeTypeaheadLabel]="node.name">
                <button matIconButton matTreeNodeToggle
                        [attr.aria-label]="'Toggle ' + node.name">
                <mat-icon class="mat-icon-rtl-mirror">
                    {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                </mat-icon>
                </button>
                @if (node.route) {
                    <button mat-button (click)="goTo(node.route)">{{node.name}}</button>    
                }
                @if (!node.route) {
                    <span>{{node.name}}</span>
                }
                
            </mat-tree-node>
        </mat-tree>

    </mat-drawer>

    <!-- <div class="example-sidenav-content">
        <button type="button" matButton (click)="drawer.toggle()">
        Toggle sidenav
        </button>
    </div> -->

</mat-drawer-container>
