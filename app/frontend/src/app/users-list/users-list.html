<div class="layout">
  <!-- Navbar -->
  <header class="navbar">
    <app-nav></app-nav>
  </header>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar">
      <app-sidenav></app-sidenav>
    </aside>

    <!-- Contenu -->
    <main class="content">
      <mat-card class="example-card">
        <mat-card-header>
          <div mat-card-avatar class="example-header-image"></div>
          <mat-card-title>Liste des utiliseurs</mat-card-title>
        </mat-card-header>
      </mat-card>

      <!-- DEBUT -->

      <!-- Barre de recherche   -->
       <div class="search-bar">
        <mat-form-field>
          <mat-label>
            Recherche
          </mat-label>
          <input matInput type="number" (input)="onSearchId($event.target.value)">
        </mat-form-field>
       </div>

      <table mat-table [dataSource]="filteredData" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>id</th>
          <td mat-cell *matCellDef="let user">{{ user.id }}</td>
        </ng-container>

        <ng-container matColumnDef="lastname">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let user">{{ user.lastname }}</td>
        </ng-container>

        <ng-container matColumnDef="firstname">
          <th mat-header-cell *matHeaderCellDef>Prénoms</th>
          <td mat-cell *matCellDef="let user">{{ user.firstname }}</td> </ng-container
        >

        <ng-container matColumnDef="age">
          <th mat-header-cell *matHeaderCellDef>Age</th>
          <td mat-cell *matCellDef="let user">{{ user.age }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <button mat-button [routerLink]="['/users',user.id,'edit']" >Modifier</button>
            <button mat-button [routerLink]="['/users',user.id,'details']">Détails</button>
              <button mat-button (click)="openDeleteDialog(user)">Supprimer</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <!-- FIN -->
    </main>
  </div>
</div>

<style>
  .main {
    display: flex;
  }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    overflow: auto;
    padding: 16px;
  }

  .search-bar{
    margin: 16px 0;
  }
</style>
