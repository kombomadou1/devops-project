<h2 mat-dialog-title>{{ data.title || 'Confirmation' }}</h2>
    <mat-dialog-content>
      {{ data.message || 'Voulez-vous vraiment supprimer cet élément ?' }}
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button (click)="onCancel()">Annuler</button>
      <button mat-raised-button color="warn" (click)="onConfirm()">Supprimer</button>
    </mat-dialog-actions>
