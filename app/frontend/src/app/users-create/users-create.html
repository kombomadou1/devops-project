<div class="layout">
  <!-- Navbar -->
  <header class="navbar">
    <app-nav></app-nav>
  </header>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar">
      <app-sidenav></app-sidenav>
    </aside>

    <!-- Contenu -->
    <main class="content">
      <mat-card>
        <mat-card-header>
          <div mat-card-avatar class="example-header-image"></div>
          <mat-card-title>Création d'utilisateur</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="example-form">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Prenom</mat-label>
              <input matInput placeholder="Firstname" formControlName="firstname" />
            </mat-form-field>

            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Nom</mat-label>
              <input matInput placeholder="Lastname" formControlName="lastname" />
            </mat-form-field>

            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Age</mat-label>
              <input matInput placeholder="Age" formControlName="age" />
            </mat-form-field>

            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Mot de passe</mat-label>
              <input
                matInput
                type="password"
                placeholder="Mot de passe"
                formControlName="password"
              />
            </mat-form-field>

            <button matButton="filled" type="submit" [disabled]="userForm.invalid || loading">
              Enregistrer
            </button>
            @if (error) {
            <div class="error">{{ error }}</div>
            }
          </form>
        </mat-card-content>
      </mat-card>

      <!-- DEBUT -->

      <!-- FIN -->
    </main>
  </div>
</div>

<style>
  .main {
    display: flex;
  }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    overflow: auto;
    padding: 16px;
  }
  .example-form {
    display: flex;
    flex-direction: column;
    /* gap: 20px; */
    /* padding: 20px; */
  }
  input {
    height: 30px;
    width: 100%;
  }
 
</style>
